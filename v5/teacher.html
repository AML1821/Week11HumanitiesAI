<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">

  <link rel="stylesheet" href="style.css">
</head>
<body class="teacher">
  <header class="topbar">
    <a class="brand" href="../">Should I Use AI Here?</a>
    <div class="topbar-actions">
      <span class="progress">Teacher view</span>
      <a class="link-btn" href="./">Play the game</a>
    </div>
  </header>

  <main id="app" tabindex="-1">
    <p class="loading">Loading the scenes…</p>

  <div id="announcer" class="visually-hidden" aria-live="polite"></div>

  <footer class="foot">
    <span>ENC 1102 · v5 · Teacher view. Student files are read in this browser only and never sent anywhere.</span>
    <span class="foot-links"><a href="./">Play the game</a> · <a href="../">All versions</a></span>

  <script src="teacher.js"></script>
